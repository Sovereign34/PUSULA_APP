# dıcker/docker-compose.yml
# Hetzner CX22 üzerinde n8n self-hosted + Postgres kurulumu.
# Kaynak: MASTER_PLAN.md v5.7 (B13 kapandı — Hetzner CX22 kararı),
#         CONFIG_SCHEMA.md §1.4 (n8n değişkenleri).
# Not: Bu dosya henüz DEPLOY EDİLMEDİ — Faz 2 başladığında kullanılacak
# iskelet. .env dosyası (bu klasörde .env.example'dan türetilir) gerçek
# secret değerlerini taşır, asla repoya commit edilmez.

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PUSULA_DB_USER}
      POSTGRES_PASSWORD: ${PUSULA_DB_PASSWORD}
      POSTGRES_DB: ${PUSULA_DB_NAME}
    volumes:
      - pusula_pg_data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"  # sadece localhost — dışa açık değil
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PUSULA_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      WEBHOOK_URL: ${N8N_WEBHOOK_BASE_URL}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${PUSULA_DB_NAME}
      DB_POSTGRESDB_USER: ${PUSULA_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${PUSULA_DB_PASSWORD}
      GENERIC_TIMEZONE: "Europe/Istanbul"
    ports:
      - "5678:5678"
    volumes:
      - pusula_n8n_data:/home/node/.n8n

volumes:
  pusula_pg_data:
  pusula_n8n_data:
